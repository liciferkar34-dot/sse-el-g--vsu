<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Notifications - Bishnupur Elect(G)</title>
    <style>
        /* =========================================
           ১. Premium CSS Variables & Themes
           ========================================= */
        :root {
            --bg-gradient: linear-gradient(135deg, #e0eafc, #cfdef3, #e0eafc);
            --text-main: #1e293b;
            --text-muted: #475569;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
            --accent: #0284c7;
            --accent-glow: rgba(2, 132, 199, 0.4);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        }

        body.dark-mode {
            --bg-gradient: linear-gradient(135deg, #0f172a, #1e293b, #0f172a);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #38bdf8;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        body { font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 0; color: var(--text-main); background: var(--bg-gradient); background-size: 200% 200%; animation: gradientMove 15s ease infinite; min-height: 100vh; display: flex; flex-direction: column; transition: color 0.3s; }
        @keyframes gradientMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* Header */
        .smart-header { background: var(--glass-bg); backdrop-filter: blur(12px); border-bottom: 1px solid var(--glass-border); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; box-shadow: var(--shadow); }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .vsu-logo-left { width: 55px; height: 55px; background: white; border-radius: 8px; padding: 3px; border: 2px solid var(--accent); object-fit: contain; }
        .header-text h1 { margin: 0; font-size: 24px; color: var(--accent); text-transform: uppercase; }
        .header-text p { margin: 2px 0 0 0; font-size: 13px; color: var(--text-muted); font-weight: 600;}
        .header-right { display: flex; align-items: center; gap: 20px; }
        .theme-btn { background: rgba(128,128,128,0.1); border: 1px solid var(--glass-border); font-size: 18px; cursor: pointer; padding: 8px; border-radius: 50%; transition: 0.3s; }
        .theme-btn:hover { background: var(--accent); color: white; }
        .ir-logo-right { width: 55px; height: 55px; background: white; border-radius: 50%; padding: 3px; border: 2px solid var(--accent); object-fit: contain; }

        /* Main Content */
        .main-container { max-width: 1000px; margin: 30px auto; padding: 0 20px; flex-grow: 1; width: 100%; box-sizing: border-box;}
        .top-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .back-btn { background: var(--glass-bg); color: var(--text-main); padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; border: 1px solid var(--glass-border); transition: 0.3s; box-shadow: var(--shadow); }
        .back-btn:hover { background: var(--accent); color: white; }
        .section-title { font-size: 24px; font-weight: bold; color: var(--text-main); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .section-title::after { content: ""; flex-grow: 1; height: 1px; background: var(--glass-border); }

        /* Notice Board Table */
        .notice-board { background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: rgba(0,0,0,0.05); padding: 15px 20px; font-size: 15px; color: var(--text-muted); text-transform: uppercase; border-bottom: 2px solid var(--glass-border);}
        td { padding: 15px 20px; border-bottom: 1px solid var(--glass-border); color: var(--text-main); font-size: 16px; }
        tr:last-child td { border-bottom: none; }
        tr:hover { background: rgba(128,128,128,0.08); }

        .date-badge { background: var(--accent); color: white; padding: 5px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; }
        .notice-title { font-weight: bold; }
        
        .view-btn { background: var(--accent); color: white; padding: 8px 15px; border-radius: 6px; text-decoration: none; font-size: 14px; font-weight: bold; transition: 0.3s; display: inline-block;}
        .view-btn:hover { background: #0369a1; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.2);}

        .footer { text-align: center; padding: 20px; background: var(--glass-bg); backdrop-filter: blur(10px); color: var(--text-muted); font-size: 12px; border-top: 1px solid var(--glass-border); font-weight: bold; }
    </style>
</head>
<body>

    <header class="smart-header">
        <div class="header-left">
            <img src="vsu_logo.png" alt="VSU Logo" class="vsu-logo-left">
            <div class="header-text">
                <h1>Indian Railways</h1>
                <p>SSE/Elect(G) • Bishnupur</p>
            </div>
        </div>
        <div class="header-right">
            <button class="theme-btn" id="themeToggle" onclick="toggleTheme()" title="Switch Theme">🌙</button>
            <img src="images.jpeg" alt="IR Logo" class="ir-logo-right">
        </div>
    </header>

    <div class="main-container">
        
        <div class="top-controls">
            <a href="index.html" class="back-btn">⬅️ Back to Dashboard</a>
        </div>

        <div class="section-title">📢 Notice Board (Official Circulars)</div>

        <div class="notice-board">
            <table>
                <thead>
                    <tr>
                        <th width="20%">Date</th>
                        <th width="60%">Notice Subject</th>
                        <th width="20%">Download</th>
                    </tr>
                </thead>
                <tbody>
                    
                    <tr>
                        <td><span class="date-badge">28 Feb 2026</span></td>
                        <td class="notice-title">NOC FORMAT ADRA DIVISION</td>
                        <td>
                            <a href="NOC ADRA FORMAT _20251125_160848_0000.pdf" target="_blank" class="view-btn">📄 View PDF</a>
                        </td>
                    </tr>
                    </tbody>
            </table>
        </div>

    </div>

    <footer class="footer">
        &copy; 2026 Enterprise Portal | Developed for Bishnupur Electric (G), South Eastern Railway.
    </footer>

    <script>
        // Theme Toggle
        const themeBtn = document.getElementById('themeToggle');
        const body = document.body;
        if(localStorage.getItem('erp-theme') === 'dark') { body.classList.add('dark-mode'); themeBtn.textContent = '☀️'; }
        function toggleTheme() {
            body.classList.toggle('dark-mode');
            if(body.classList.contains('dark-mode')) { localStorage.setItem('erp-theme', 'dark'); themeBtn.textContent = '☀️'; } 
            else { localStorage.setItem('erp-theme', 'light'); themeBtn.textContent = '🌙'; }
        }
    </script>
</body>
</html>
