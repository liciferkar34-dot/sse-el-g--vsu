<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Notifications - Bishnupur Elect(G)</title>
    <style>
        /* =========================================
           ১. Premium CSS Variables & Themes
           ========================================= */
        :root {
            --bg-gradient: linear-gradient(135deg, #e0eafc, #cfdef3, #e0eafc);
            --text-main: #1e293b;
            --text-muted: #475569;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
            --accent: #0284c7;
            --accent-glow: rgba(2, 132, 199, 0.4);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
            --danger: #e11d48;
            --success: #16a34a;
        }

        body.dark-mode {
            --bg-gradient: linear-gradient(135deg, #0f172a, #1e293b, #0f172a);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.3);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --danger: #f43f5e;
            --success: #22c55e;
        }

        /* =========================================
           ২. Base Styles & Layout
           ========================================= */
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0; padding: 0;
            color: var(--text-main);
            background: var(--bg-gradient);
            background-size: 200% 200%;
            animation: gradientMove 15s ease infinite;
            min-height: 100vh; display: flex; flex-direction: column;
            transition: color 0.3s;
        }

        @keyframes gradientMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* =========================================
           ৩. Header (Same as Index)
           ========================================= */
        .smart-header {
            background: var(--glass-bg); backdrop-filter: blur(12px); border-bottom: 1px solid var(--glass-border);
            padding: 15px 30px; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000; box-shadow: var(--shadow);
        }

        .header-left { display: flex; align-items: center; gap: 15px; }
        .vsu-logo-left { width: 55px; height: 55px; background: white; border-radius: 8px; padding: 3px; border: 2px solid var(--accent); object-fit: contain; }
        .header-text h1 { margin: 0; font-size: 24px; color: var(--accent); text-transform: uppercase; }
        .header-text p { margin: 2px 0 0 0; font-size: 13px; color: var(--text-muted); font-weight: 600;}

        .header-right { display: flex; align-items: center; gap: 20px; }
        .theme-btn { background: rgba(128,128,128,0.1); border: 1px solid var(--glass-border); font-size: 18px; cursor: pointer; padding: 8px; border-radius: 50%; transition: 0.3s; }
        .theme-btn:hover { background: var(--accent); color: white; }
        .ir-logo-right { width: 55px; height: 55px; background: white; border-radius: 50%; padding: 3px; border: 2px solid var(--accent); object-fit: contain; }

        /* =========================================
           ৪. Main Content & Notice Board
           ========================================= */
        .main-container { max-width: 1000px; margin: 30px auto; padding: 0 20px; flex-grow: 1; width: 100%; box-sizing: border-box;}

        .top-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .back-btn { background: var(--glass-bg); color: var(--text-main); padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; border: 1px solid var(--glass-border); transition: 0.3s; box-shadow: var(--shadow); }
        .back-btn:hover { background: var(--accent); color: white; }

        .section-title { font-size: 24px; font-weight: bold; color: var(--text-main); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .section-title::after { content: ""; flex-grow: 1; height: 1px; background: var(--glass-border); }

        /* Admin Form for Adding Notice */
        .add-notice-card {
            background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border);
            padding: 25px; border-radius: 12px; margin-bottom: 30px; box-shadow: var(--shadow);
            display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end;
        }
        .input-group { display: flex; flex-direction: column; flex: 1; min-width: 200px; }
        .input-group label { font-size: 13px; font-weight: bold; color: var(--text-muted); margin-bottom: 5px; }
        .input-group input { padding: 10px 15px; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(128,128,128,0.05); color: var(--text-main); font-size: 14px; outline: none; }
        .input-group input:focus { border-color: var(--accent); background: var(--glass-bg); }
        
        .add-btn { background: var(--success); color: white; padding: 12px 25px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; height: 42px;}
        .add-btn:hover { opacity: 0.8; transform: translateY(-2px); }

        /* Notice List Table */
        .notice-board {
            background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border);
            border-radius: 12px; overflow: hidden; box-shadow: var(--shadow);
        }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: rgba(0,0,0,0.05); padding: 15px 20px; font-size: 14px; color: var(--text-muted); text-transform: uppercase; }
        td { padding: 15px 20px; border-bottom: 1px solid var(--glass-border); color: var(--text-main); font-size: 15px; }
        tr:last-child td { border-bottom: none; }
        tr:hover { background: rgba(128,128,128,0.05); }

        .date-badge { background: var(--accent); color: white; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .notice-title { font-weight: bold; }
        
        .action-btns { display: flex; gap: 10px; }
        .view-btn { background: var(--accent); color: white; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 13px; font-weight: bold; transition: 0.3s; }
        .view-btn:hover { background: #0369a1; }
        .delete-btn { background: var(--danger); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; transition: 0.3s; }
        .delete-btn:hover { opacity: 0.8; }

        .empty-msg { text-align: center; padding: 40px; color: var(--text-muted); font-size: 16px; font-style: italic; }

        .footer { text-align: center; padding: 20px; background: var(--glass-bg); backdrop-filter: blur(10px); color: var(--text-muted); font-size: 12px; border-top: 1px solid var(--glass-border); font-weight: bold; }
    </style>
</head>
<body>

    <header class="smart-header">
        <div class="header-left">
            <img src="vsu_logo.png" alt="VSU Logo" class="vsu-logo-left">
            <div class="header-text">
                <h1>Indian Railways</h1>
                <p>SSE/Elect(G) • Bishnupur</p>
            </div>
        </div>
        <div class="header-right">
            <button class="theme-btn" id="themeToggle" onclick="toggleTheme()" title="Switch Theme">🌙</button>
            <img src="images.jpeg" alt="IR Logo" class="ir-logo-right">
        </div>
    </header>

    <div class="main-container">
        
        <div class="top-controls">
            <a href="index.html" class="back-btn">⬅️ Back to Dashboard</a>
        </div>

        <div class="section-title">📢 Notice Board (PDF Uploads)</div>

        <div class="add-notice-card">
            <div class="input-group">
                <label>Date</label>
                <input type="date" id="noticeDate">
            </div>
            <div class="input-group" style="flex: 2;">
                <label>Notice Subject / Title</label>
                <input type="text" id="noticeTitle" placeholder="e.g. Holiday List 2026">
            </div>
            <div class="input-group" style="flex: 2;">
                <label>PDF File Name (Must be uploaded to GitHub)</label>
                <input type="text" id="noticeFile" placeholder="e.g. holiday_notice.pdf">
            </div>
            <button class="add-btn" onclick="addNotice()">➕ Publish Notice</button>
        </div>

        <div class="notice-board">
            <table>
                <thead>
                    <tr>
                        <th width="15%">Date</th>
                        <th width="55%">Notice Subject</th>
                        <th width="30%">Action</th>
                    </tr>
                </thead>
                <tbody id="noticeTableBody">
                    </tbody>
            </table>
        </div>

    </div>

    <footer class="footer">
        &copy; 2026 Enterprise Portal | Developed for Bishnupur Electric (G), South Eastern Railway.
    </footer>

    <script>
        // Theme Toggle
        const themeBtn = document.getElementById('themeToggle');
        const body = document.body;
        if(localStorage.getItem('erp-theme') === 'dark') { body.classList.add('dark-mode'); themeBtn.textContent = '☀️'; }
        function toggleTheme() {
            body.classList.toggle('dark-mode');
            if(body.classList.contains('dark-mode')) { localStorage.setItem('erp-theme', 'dark'); themeBtn.textContent = '☀️'; } 
            else { localStorage.setItem('erp-theme', 'light'); themeBtn.textContent = '🌙'; }
        }

        // Set Default Date to Today
        document.getElementById('noticeDate').valueAsDate = new Date();

        // Notice Board Logic
        let notices = JSON.parse(localStorage.getItem('officeNotices')) || [];

        function renderNotices() {
            const tbody = document.getElementById('noticeTableBody');
            tbody.innerHTML = '';

            if(notices.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="empty-msg">No notices available at the moment. Add a new notice above.</td></tr>';
                return;
            }

            // Sort by latest date first
            const sortedNotices = [...notices].reverse();

            sortedNotices.forEach((notice, index) => {
                // Formatting Date to look nice
                const dateObj = new Date(notice.date);
                const formattedDate = dateObj.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
                
                // Actual index in the original array for deletion
                const originalIndex = notices.length - 1 - index;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><span class="date-badge">${formattedDate}</span></td>
                    <td class="notice-title">${notice.title}</td>
                    <td class="action-btns">
                        <a href="${notice.file}" target="_blank" class="view-btn">📄 View PDF</a>
                        <button class="delete-btn" onclick="deleteNotice(${originalIndex})">🗑️ Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function addNotice() {
            const date = document.getElementById('noticeDate').value;
            const title = document.getElementById('noticeTitle').value.trim();
            const file = document.getElementById('noticeFile').value.trim();

            if(!title || !file) {
                alert("Please enter both the Notice Title and PDF File Name!");
                return;
            }

            notices.push({ date, title, file });
            localStorage.setItem('officeNotices', JSON.stringify(notices));
            
            document.getElementById('noticeTitle').value = '';
            document.getElementById('noticeFile').value = '';
            renderNotices();
        }

        function deleteNotice(index) {
            if(confirm("Are you sure you want to delete this notice?")) {
                notices.splice(index, 1);
                localStorage.setItem('officeNotices', JSON.stringify(notices));
                renderNotices();
            }
        }

        // Initial Load
        renderNotices();
    </script>
</body>
</html>
